name: Linux-arm-wheels

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-22.04-arm  # free once randompack goes public
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: "cp310-* cp311-* cp312-* cp313-*"
            image: manylinux2014
            artifact: wheels-linux-aarch64
          - build: "cp314-*"
            image: manylinux_2_28
            artifact: wheels-linux-aarch64-cp314

    env:
      CIBW_ARCHS_LINUX: aarch64
      CIBW_BUILD: ${{ matrix.build }}
      CIBW_CONFIG_SETTINGS: "setup-args=-Dblas=builtin"
      CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.image }}
      CIBW_SKIP: "*musllinux*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel python/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 7
